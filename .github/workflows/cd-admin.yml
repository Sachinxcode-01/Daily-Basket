name: Continuous Deployment - Admin Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - '.github/workflows/cd-admin.yml'

concurrency:
  group: cd-admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-admin:
    name: Build & Validate Admin Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Admin App
        run: pnpm --filter admin run lint

      - name: Typecheck Admin App
        run: pnpm --filter admin run typecheck

      - name: Build Admin App
        run: pnpm --filter admin build
