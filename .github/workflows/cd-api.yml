name: Continuous Deployment - API Service

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'packages/**'
      - 'infrastructure/docker/Dockerfile.api'
      - '.github/workflows/cd-api.yml'

concurrency:
  group: cd-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-api:
    name: Build, Test & Push API Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daily_basket?schema=public"
        run: pnpm --filter api run prisma:generate

      - name: Run API Unit Tests
        run: pnpm --filter api run test -- --forceExit --maxWorkers=2

      - name: Build NestJS API
        run: pnpm --filter api run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        run: |
          docker build -t daily-basket-api:latest -f infrastructure/docker/Dockerfile.api .
