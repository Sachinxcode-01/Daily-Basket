name: Continuous Deployment - Customer Website

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'packages/**'
      - '.github/workflows/cd-website.yml'

concurrency:
  group: cd-website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-website:
    name: Build & Validate Customer Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Customer Website
        run: pnpm --filter website run lint

      - name: Typecheck Customer Website
        run: pnpm --filter website run typecheck

      - name: Build Next.js App
        run: pnpm --filter website build
