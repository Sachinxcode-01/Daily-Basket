name: Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daily_basket?schema=public"
        run: pnpm --filter api run prisma:generate

      - name: Lint Website
        run: pnpm --filter website run lint

      - name: Lint Admin
        run: pnpm --filter admin run lint

      - name: Lint Delivery
        run: pnpm --filter delivery run lint

      - name: Lint API
        run: pnpm --filter api run lint

      - name: Typecheck Website
        run: pnpm --filter website run typecheck

      - name: Typecheck Admin
        run: pnpm --filter admin run typecheck

      - name: Typecheck Delivery
        run: pnpm --filter delivery run typecheck

      - name: Typecheck API
        run: pnpm --filter api run typecheck

  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daily_basket?schema=public"
        run: pnpm --filter api run prisma:generate

      - name: Run API Unit Tests
        run: pnpm --filter api run test

  build-verification:
    name: Verify Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daily_basket?schema=public"
        run: pnpm --filter api run prisma:generate

      - name: Build API
        run: pnpm --filter api run build

      - name: Build Website
        run: pnpm --filter website build

      - name: Build Admin
        run: pnpm --filter admin build

      - name: Build Delivery
        run: pnpm --filter delivery build

  flutter-ci:
    name: Flutter Mobile CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Analyze Flutter App
        run: flutter analyze --no-fatal-infos
        working-directory: apps/mobile

      - name: Run Flutter Tests
        env:
          FLUTTER_TEST: 'true'
        run: |
          set -o pipefail
          flutter test --reporter=expanded 2>&1 | tee test_log.txt
        working-directory: apps/mobile

      - name: Publish Flutter Test Summary
        if: always()
        run: |
          echo "### Flutter Test Log Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 apps/mobile/test_log.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
