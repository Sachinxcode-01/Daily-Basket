name: Daily Basket Enterprise CI/CD & Reliability Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality-and-lint:
    name: 🛡️ Code Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/api/package-lock.json

      - name: Install API Dependencies
        run: |
          cd services/api
          npm ci

      - name: Run Prisma Client Generation
        run: |
          cd services/api
          npx prisma generate

      - name: Run TypeScript Typecheck
        run: |
          cd services/api
          npm run typecheck

      - name: Run ESLint
        run: |
          cd services/api
          npm run lint

  security-and-vulnerability-scan:
    name: 🔒 Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit NPM Dependencies
        run: |
          cd services/api
          npm audit --audit-level=high || true

  unit-and-integration-tests:
    name: 🧪 Unit, Integration & Performance Tests
    runs-on: ubuntu-latest
    needs: [code-quality-and-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/api/package-lock.json

      - name: Install API Dependencies
        run: |
          cd services/api
          npm ci
          npx prisma generate

      - name: Run Unit & Benchmark Tests
        run: |
          cd services/api
          npm run test -- --passWithNoTests

  docker-build-and-push:
    name: 🐳 Docker Multi-Stage Build & Image Push
    runs-on: ubuntu-latest
    needs: [unit-and-integration-tests, security-and-vulnerability-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          file: ./services/api/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/daily-basket-api:latest
            ghcr.io/${{ github.repository_owner }}/daily-basket-api:${{ github.sha }}

  k8s-zero-downtime-deploy:
    name: 🚀 Kubernetes Zero-Downtime Deployment
    runs-on: ubuntu-latest
    needs: [docker-build-and-push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Configure Kubeconfig & Deploy Kubernetes Manifests
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG || '' }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            mkdir -p ~/.kube
            echo "$KUBE_CONFIG" > ~/.kube/config
            chmod 600 ~/.kube/config
          fi
          kubectl apply -f infrastructure/k8s/configmap.yaml
          kubectl apply -f infrastructure/k8s/deployment.yaml
          kubectl apply -f infrastructure/k8s/service.yaml
          kubectl apply -f infrastructure/k8s/ingress.yaml
          kubectl apply -f infrastructure/k8s/hpa.yaml

      - name: Rollout Status & Automated Rollback Protection
        run: |
          kubectl rollout status deployment/daily-basket-api -n daily-basket --timeout=120s || (kubectl rollout undo deployment/daily-basket-api -n daily-basket && exit 1)
