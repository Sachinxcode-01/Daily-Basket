name: Daily Basket Enterprise CI/CD & Reliability Pipeline

on:
  push:
    branches: [ release/* ]
  pull_request:
    branches: [ release/* ]
  workflow_dispatch:

concurrency:
  group: enterprise-ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  code-quality-and-lint:
    name: 🛡️ Code Quality & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma Client Generation
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daily_basket?schema=public"
        run: pnpm --filter api run prisma:generate

      - name: Run TypeScript Typecheck
        run: pnpm --filter api run typecheck

      - name: Run ESLint
        run: pnpm --filter api run lint

  security-and-vulnerability-scan:
    name: 🔒 Security & Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Audit Dependencies
        run: pnpm audit --audit-level=high || true

  unit-and-integration-tests:
    name: 🧪 Unit, Integration & Performance Tests
    runs-on: ubuntu-latest
    needs: [code-quality-and-lint]
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma Client Generation
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/daily_basket?schema=public"
        run: pnpm --filter api run prisma:generate

      - name: Run Unit & Benchmark Tests
        run: pnpm --filter api run test

  docker-build-and-push:
    name: 🐳 Docker Multi-Stage Build & Image Push
    runs-on: ubuntu-latest
    needs: [unit-and-integration-tests, security-and-vulnerability-scan]
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Downcase Names
        id: names
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.OWNER }}/daily-basket-api:latest
            ghcr.io/${{ steps.names.outputs.OWNER }}/daily-basket-api:${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.REPO }}/api:latest
            ghcr.io/${{ steps.names.outputs.REPO }}/api:${{ github.sha }}

  k8s-zero-downtime-deploy:
    name: 🚀 Kubernetes Zero-Downtime Deployment
    runs-on: ubuntu-latest
    needs: [docker-build-and-push]
    permissions:
      contents: read
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Kubeconfig & Deploy Kubernetes Manifests
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            mkdir -p ~/.kube
            echo "$KUBE_CONFIG" > ~/.kube/config
            chmod 600 ~/.kube/config
            kubectl apply -f infrastructure/k8s/configmap.yaml
            kubectl apply -f infrastructure/k8s/deployment.yaml
            kubectl apply -f infrastructure/k8s/service.yaml
            kubectl apply -f infrastructure/k8s/ingress.yaml
            kubectl apply -f infrastructure/k8s/hpa.yaml
          else
            echo "KUBECONFIG secret not configured. Skipping Kubernetes deployment."
          fi

      - name: Rollout Status & Automated Rollback Protection
        run: |
          if [ -f ~/.kube/config ]; then
            kubectl rollout status deployment/daily-basket-api -n daily-basket --timeout=180s || (kubectl rollout undo deployment/daily-basket-api -n daily-basket && exit 1)
          else
            echo "Kubernetes config not present. Rollout status check skipped."
          fi
