name: daily_basket_mobile
description: "Daily Basket Enterprise Flutter Mobile Customer Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  http: ^1.2.0
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.5.3
  google_maps_flutter_android: ^2.6.0
  flutter_staggered_animations: ^1.1.1
  # Enterprise AI Chat — Voice & Image
  speech_to_text: ^7.0.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon_zoomed.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

