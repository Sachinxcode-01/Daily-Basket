<span class="material-symbols-outlined text-[24px]">add_circle</span>
</button>
<div class="flex-1 relative bg-surface-container-lowest border border-outline-variant/60 rounded-[20px] focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary transition-all shadow-sm">
<textarea class="w-full bg-transparent border-none rounded-[20px] py-3 pl-4 pr-12 text-[14px] text-on-surface placeholder:text-on-surface-variant/60 resize-none focus:ring-0 max-h-[120px]" id="chat-input" placeholder="Type a message..." rows="1" style="min-height: 44px;"></textarea>
<button aria-label="Send message" class="absolute right-2 bottom-2 p-1.5 text-primary/50 hover:text-primary transition-colors rounded-full focus:outline-none">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">send</span>
</button>

</div>

</div>
<script>
        // Simple interaction for Quick Replies
        document.addEventListener('DOMContentLoaded', () => {
            const quickReplies = document.querySelectorAll('.quick-reply-btn');
            const chatInput = document.getElementById('chat-input');
            
            quickReplies.forEach(btn => {
                btn.addEventListener('click', () => {
                    chatInput.value = btn.textContent;
                    // Auto-focus input after selecting a quick reply
                    chatInput.focus();
                    
                    // Simple auto-resize logic for textarea
                    chatInput.style.height = 'auto';
                    chatInput.style.height = (chatInput.scrollHeight) + 'px';
                });
            });

            // Textarea auto-resize
            chatInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                
                // Toggle send button color based on input
                const sendBtn = this.nextElementSibling;
                if (this.value.trim().length > 0) {
                    sendBtn.classList.remove('text-primary/50');
                    sendBtn.classList.add('text-primary');
                } else {
                    sendBtn.classList.add('text-primary/50');
                    sendBtn.classList.remove('text-primary');
                }
            });
        });
    </script>
