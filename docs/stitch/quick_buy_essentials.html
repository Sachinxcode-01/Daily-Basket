<script>
        // Micro-interaction for Add buttons
        document.querySelectorAll('button[class*="absolute bottom-"]').forEach(button => {
            button.addEventListener('click', function() {
                const icon = this.querySelector('span');
                if(icon.textContent === 'add') {
                    // Temporarily show checkmark
                    icon.textContent = 'check';
                    this.classList.add('bg-primary-container', 'text-primary');
                    if(this.classList.contains('bg-primary')) {
                       this.classList.remove('bg-primary', 'text-on-primary');
                    }
                    setTimeout(() => {
                        icon.textContent = 'add';
                        this.classList.remove('bg-primary-container', 'text-primary');
                        // Restore original classes based on size
                        if(this.classList.contains('w-10')) {
                            this.classList.add('bg-primary', 'text-on-primary');
                        }
                    }, 1000);
                }
            });
        });
    </script>
