<div class="w-48 h-48 rounded-full bg-surface-container overflow-hidden shadow-sm flex items-center justify-center">

            </h1>
<p class="font-body text-[16px] font-normal text-on-surface-variant leading-[24px] max-w-md mx-auto">
                Fresh groceries, daily essentials, and exclusive offers delivered to your doorstep.
            </p>

<span class="material-symbols-outlined mr-3 text-secondary" data-icon="mail">mail</span>
