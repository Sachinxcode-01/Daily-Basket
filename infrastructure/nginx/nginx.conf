user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Upstreams
    upstream api_service {
        server api:4000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream website_service {
        server website:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream admin_service {
        server admin:3001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream delivery_service {
        server delivery:3002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Security Headers Map
    map $scheme $hsts_header {
        https "max-age=63072000; includeSubDomains; preload";
        default "";
    }

    # HTTP to HTTPS Redirect
    server {
        listen 80;
        server_name dailybasket.com www.dailybasket.com api.dailybasket.com admin.dailybasket.com delivery.dailybasket.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 1. API Service Server (api.dailybasket.com)
    server {
        listen 443 ssl http2;
        server_name api.dailybasket.com;

        ssl_certificate /etc/letsencrypt/live/api.dailybasket.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.dailybasket.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security $hsts_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        client_max_body_size 25M;

        # WebSocket Proxying
        location /socket.io/ {
            proxy_pass http://api_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # Auth Rate Limiting
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://api_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API Endpoint Proxying
        location / {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 2. Customer Website (dailybasket.com / www.dailybasket.com)
    server {
        listen 443 ssl http2;
        server_name dailybasket.com www.dailybasket.com;

        ssl_certificate /etc/letsencrypt/live/dailybasket.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dailybasket.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security $hsts_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location / {
            proxy_pass http://website_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 3. Admin Dashboard (admin.dailybasket.com)
    server {
        listen 443 ssl http2;
        server_name admin.dailybasket.com;

        ssl_certificate /etc/letsencrypt/live/admin.dailybasket.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.dailybasket.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security $hsts_header always;
        add_header X-Frame-Options "DENY" always;

        location / {
            proxy_pass http://admin_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 4. Delivery Partner Portal (delivery.dailybasket.com)
    server {
        listen 443 ssl http2;
        server_name delivery.dailybasket.com;

        ssl_certificate /etc/letsencrypt/live/delivery.dailybasket.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/delivery.dailybasket.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security $hsts_header always;
        add_header X-Frame-Options "DENY" always;

        location / {
            proxy_pass http://delivery_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
