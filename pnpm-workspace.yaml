packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'

allowBuilds:
  '@firebase/util': set this to true or false
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  'prisma': true
  protobufjs: set this to true or false
  'unrs-resolver': true
