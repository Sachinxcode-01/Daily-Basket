# ==============================================================================
# Render Blueprint for Daily Basket Backend API Deployment
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: daily-basket-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: daily-basket-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

databases:
  - name: daily-basket-db
    databaseName: daily_basket
    user: daily_basket_user
    plan: free
    region: oregon
